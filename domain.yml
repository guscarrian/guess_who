intents:
  - greet
  - goodbye
  - user_answers
  - sample
  - affirm
  - deny
  - questions: {triggers: action_user_answers}

entities:
  - eyes
  - hair
  - hair style
  - hair color
  - hair colour
  - eye color
  - eye colour
  - gender
  - background
  - nationality
  - age
  - language
  - languages
  - interest
  - interests
  - object_type
  - attribute



slots:
  object_type:
    type: unfeaturized
  attribute:
    type: unfeaturized

actions:
  - utter_greet
  - utter_play_game
  - utter_goodbye
  - utter_game_intro
  - utter_ready
  - utter_characters
  - utter_start
  - action_user_answers
  - action_query_knowledge_base


templates:
  utter_greet:
  - text: "Hey, buddy!"

  utter_play_game:
  - text: "Do you want to play a game?"
    image: "https://i.pinimg.com/originals/0e/5e/d3/0e5ed305f4d5a37eb08559dba929805b.jpg"

  utter_game_intro:
  - text: "Great! This is how it works: from a list of characters I will randomly pick up one of them and you will have to ask yes/no questions to guess who is my character. You can ask about the gender, eye color, hair color, hair style, age, nationality, background or languagues. When you think you are ready to make a guess, please type \"I think the character is <name>\"."
 
  utter_ready:
  - text: "Are you ready?"

  utter_characters:
  - text: "Here are all characters! https://docs.google.com/document/d/1ft9msZ7VPesiEvudveaXTYmf02tqpuhdsj5G_juNHL4/edit?usp=sharing"

  utter_start:
  - text: "There we go. Ask a question!"

  utter_goodbye:
  - text: "Bye"
  - text: "Ok, bye!"

  utter_ask_rephrase:
  - text: "Sorry, I'm not sure I understand. Can you rephrase?"
  - text: "Can you please rephrase? I did not got that."



session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
